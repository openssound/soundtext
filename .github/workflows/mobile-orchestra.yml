name: Pacchetto orchestra di SoundText Mobile

# Costruisce il SoundFont .sf3 del pacchetto orchestra (mobile/tools/costruisci_sf3.py) dalle librerie CC0
# VSCO 2 CE e VCSL, scaricate come fa SoundText sul computer (scarica_strumenti.py, commit fissi), e lo mette
# fra gli asset di una release. Si lancia a mano: stampa lo SHA-256 da scrivere in mobile/scarica_vendor.sh
# (ORCH_SHA). Lo stesso file esce a parita' di sorgenti.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release (quello in scarica_vendor.sh)"
        default: mobile-orchestra-2

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # crea la release e ci allega il pacchetto
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Strumenti
        run: |
          pip install "numpy>=1.24,<2"
          ffmpeg -version | head -1
      - name: Librerie VSCO 2 CE e VCSL
        run: |
          python - <<'PY'
          from pathlib import Path
          import scarica_strumenti as s
          dest = Path("sorgenti")
          for nome in ("vsco-percussioni", "vsco-legni", "vsco-ottoni", "vsco-archi", "vcsl-vibrafono", "vcsl-clavicembalo"):
              base = s.VSCO_BASE if nome.startswith("vsco") else s.VCSL_BASE
              s.scarica_orchestra(nome, base, dest / nome.split("-")[0])
          PY
      - name: Costruzione
        run: python mobile/tools/costruisci_sf3.py --vsco sorgenti/vsco --vcsl sorgenti/vcsl --out soundtext-orchestra.sf3 --format sf3
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum soundtext-orchestra.sf3
          gh release view "${{ inputs.tag }}" >/dev/null 2>&1 || gh release create "${{ inputs.tag }}" \
            --title "Pacchetto orchestra di SoundText Mobile" \
            --notes "SoundFont .sf3 con archi, legni, ottoni, arpa, timpani e percussioni intonate, costruito da VSCO 2 CE e VCSL (CC0). SHA-256: vedi il log del workflow."
          gh release upload "${{ inputs.tag }}" soundtext-orchestra.sf3 soundtext-orchestra.sf3.json --clobber
