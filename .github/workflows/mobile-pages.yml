name: SoundText Mobile (prototipo) su GitHub Pages

# Pubblica il prototipo della fase 0 (mobile/) su GitHub Pages, per provarlo
# su telefono in HTTPS: su iPhone e su rete mobile serve un indirizzo
# pubblico sicuro (service worker, AudioWorklet). I componenti di terzi
# (Pyodide, js-synthesizer, SoundFont TimGM6mb) non sono nel repository:
# li scarica mobile/scarica_vendor.sh con i controlli SHA-256.
on:
  push:
    branches: [mobile-prototipo]
    paths:
      - "mobile/**"
      - "core/**"
      - "locales/**"
      - "examples/*.st"
      - ".github/workflows/mobile-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mobile-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout codice
        uses: actions/checkout@v7

      - name: Imposta Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Solo quello che serve a mobile/build.py per trovare i moduli di core/
      # usati dal motore (niente PySide6: il motore non lo usa)
      - name: Dipendenze del motore
        run: pip install "st-language==2.12.2" "mido==1.3.3" "numpy>=1.24,<2"

      # Un .st aperto e salvato senza modifiche resta identico (songs.js)
      - name: Test dell'app (formato dei file)
        run: node --test mobile/tests/*.test.cjs

      - name: Componenti di terzi (Pyodide, js-synthesizer, SoundFont)
        run: mobile/scarica_vendor.sh

      - name: Bundle del motore
        run: python mobile/build.py

      - name: Pulizia
        run: rm -rf mobile/__pycache__

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: mobile

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
