# Flatpak di SoundText (vedi README.md).
#
# I moduli audio comuni vengono da flathub/shared-modules, da aggiungere
# come sottomodulo git accanto a questo file:
#   git submodule add https://github.com/flathub/shared-modules.git
# I pacchetti Python sono in python-deps.json (genera_dipendenze.py).
app-id: io.github.openssound.SoundText
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: soundtext

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # audio: PulseAudio/PipeWire; il socket di PipeWire anche per l'uscita su JACK
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  # tastiere MIDI (sequencer ALSA) e schede audio
  - --device=all
  # Suoni > Scarica e installa (SoundFont, strumenti SFZ, profili NAM)
  - --share=network
  # brani, SoundFont e strumenti dell'utente
  - --filesystem=xdg-documents
  - --filesystem=xdg-music
  # i plugin installati come estensioni Flatpak (sotto)
  - --env=LV2_PATH=/app/extensions/Plugins/lv2
  - --env=VST3_PATH=/app/extensions/Plugins/vst3
  - --env=CLAP_PATH=/app/extensions/Plugins/clap

# I plugin del sistema non si vedono dentro un Flatpak: si usano quelli
# pubblicati come estensioni (org.freedesktop.LinuxAudio.Plugins.*: LSP,
# Surge XT, Dragonfly Reverb, x42, ZamPlugins...).
add-extensions:
  org.freedesktop.LinuxAudio.Plugins:
    directory: extensions/Plugins
    version: '25.08'
    add-ld-path: lib
    merge-dirs: lv2;vst3;clap
    subdirectories: true
    no-autodownload: true

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - '*.a'
  - '*.la'

modules:
  # FluidSynth 2.3, non quello di shared-modules (2.5): dalla 2.4
  # fluid_synth_set_sample_rate() non fa piu' niente, e SoundText la usa per
  # riportare il riverbero allo stato iniziale a ogni render (vedi
  # core/fluid.py, reset_effects): con la 2.5 lo stesso brano esportato due
  # volte non da' lo stesso audio
  - name: fluidsynth
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    cleanup:
      - /bin
      - '*.so'
    sources:
      - type: archive
        url: https://github.com/FluidSynth/fluidsynth/archive/v2.3.7.tar.gz
        sha256: 38d1d910783ab67c07a4d859d1aa95525979ff352b927e25b1ae894c774bb4c4
  - shared-modules/linux-audio/lv2.json
  - shared-modules/linux-audio/lilv.json

  - name: portaudio
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DPA_USE_JACK=OFF
      # PortAudio 19.7 dichiara un CMake troppo vecchio per quello del runtime
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/PortAudio/portaudio.git
        tag: v19.7.0
        commit: 147dd722548358763a8b649b3e4b41dfffbcfbb6

  # QtMultimedia (metronomo) e QtNetwork delle wheel di PySide6 vogliono
  # libgssapi_krb5, che il runtime freedesktop non ha
  - name: krb5
    subdir: src
    config-opts:
      - --localstatedir=/var/lib
      - --sbindir=${FLATPAK_DEST}/bin
      - --disable-rpath
      - --disable-static
    cleanup:
      - /bin
      - /share/et
      - /share/examples
    sources:
      - type: archive
        url: https://kerberos.org/dist/krb5/1.22/krb5-1.22.1.tar.gz
        sha256: 1a8832b8cad923ebbf1394f67e2efcf41e3a49f460285a66e35adec8fa0053af

  - python-deps.json

  # tastiere MIDI: python-rtmidi non ha wheel per Python 3.13, si compila
  # qui (ALSA e JACK sono nel runtime) con meson-python
  - name: python-rtmidi
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} --no-build-isolation meson-python pyproject-metadata
      - pip3 install --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} --no-build-isolation --no-deps python_rtmidi-1.5.8.tar.gz
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/96/62/0c1cf20fe158b0e623e78acbf5fb6de5f1410a408f65f727e4090497627b/meson_python-0.22.1-py3-none-any.whl
        sha256: 258fde948cf45aab5df23fcc9e17a9050ee73d4e1002fe6cf86519f61c414778
      - type: file
        url: https://files.pythonhosted.org/packages/b9/8e/d883718e872abc214ba053f60f7e6edc2abd5ffbd1544beb01a9c92ddd3c/pyproject_metadata-0.12.1-py3-none-any.whl
        sha256: f7162d580a96386a8eb096da06215f981f547d1490f03055ef99e323bc2da427
      - type: file
        url: https://files.pythonhosted.org/packages/dd/ee/0f91965dcc471714c69df21e5ca3d94dc81411b7dee2d31ff1184bea07c9/python_rtmidi-1.5.8.tar.gz
        sha256: 7f9ade68b068ae09000ecb562ae9521da3a234361ad5449e83fc734544d004fa

  - name: soundtext
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/soundtext /app/extensions/Plugins
      - cp -a main.py core gui assets docs locales examples licenses scarica_strumenti.py LICENSE THIRD_PARTY_NOTICES.md /app/share/soundtext/
      - rm -rf /app/share/soundtext/docs/guida_brano
      - python3 -m compileall -q /app/share/soundtext
      - install -Dm755 packaging/flatpak/soundtext.sh /app/bin/soundtext
      - install -Dm644 packaging/flatpak/io.github.openssound.SoundText.desktop -t /app/share/applications
      - install -Dm644 packaging/flatpak/io.github.openssound.SoundText.metainfo.xml -t /app/share/metainfo
      - install -Dm644 assets/icon.png /app/share/icons/hicolor/256x256/apps/io.github.openssound.SoundText.png
      - install -Dm644 assets/icon.svg /app/share/icons/hicolor/scalable/apps/io.github.openssound.SoundText.svg
    sources:
      # dalla versione che contiene packaging/flatpak: tag e commit vanno
      # aggiornati a ogni release
      - type: git
        url: https://github.com/openssound/soundtext.git
        tag: v1.19.0
        commit: 3517b91cceccd1856246f7293bc8ec463e5bd3dd
